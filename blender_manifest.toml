schema_version = "1.0.0"

id = "simple_collider"

version = "1.2.0"
name = "Simple Collider"
tagline = "Create physics colliders for games and real-time applications"
maintainer = "Matthias Patscheider <patscheider.matthias@gmail.com>"
type = "add-on"

website = "https://weisl.github.io/simple_collider/collider_overview/"

tags = ["3D View", "Scene", "User Interface"]

blender_version_min = "4.2.0"

license = [
    "SPDX:GPL-3.0-or-later",
]

platforms = ["windows-x64", "linux-x64", "macos-arm64"]

copyright = [
    "2023 Matthias Patscheider",
]

[permissions]
network = "Checks GitHub for a newer release"
files = "Executes Auto Convex binaries; reads/writes preset and OBJ files"


[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/.gitignore",
    "/.gitattributes",
    "/*.zip",
    "/tests/",
    "/venv/",
    "/.github/",
    "/CHANGELOG.md",
    "/MANUAL_QA_CHECKLIST.md",
]
