name: Build Release

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: ${{ github.event.repository.name }}

      - name: Zip Repository (excludes .git*)
        run: |
          version_with_underscores=$(echo ${{ github.ref_name }} | tr '.' '_')
          zip -r simple_collider_${version_with_underscores}.zip \
            ${{ github.event.repository.name }} \
            -x "${{ github.event.repository.name }}/.git*" \
            -x "${{ github.event.repository.name }}/.*/*" \
            -x "${{ github.event.repository.name }}/tests/*" \
            -x "${{ github.event.repository.name }}/venv/*"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          notes=$(awk -v ver="$version" '
            /^## / {
              if (found) exit
              if ($0 ~ ("v" ver "([^0-9.]|$)")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG.md section found for version $version (tag ${{ github.ref_name }}). Add a '## Simple Collider v$version' section before tagging."
            exit 1
          fi
          echo "$notes" > "${{ github.workspace }}/release_notes.md"
        working-directory: ${{ github.event.repository.name }}

      - name: Create versioned build with filtered zip file
        run: |
          version_with_underscores=$(echo ${{ github.ref_name }} | tr '.' '_')
          cd ${{ github.event.repository.name }}
          gh release create ${{ github.ref_name }} \
            --notes-file "${{ github.workspace }}/release_notes.md" \
            ../simple_collider_${version_with_underscores}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
